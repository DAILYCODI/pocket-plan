name: Deploy Pocket Plan quote service
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocket-plan-quote-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Deploy private quote endpoint
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: market-service
          wranglerVersion: '4'
          command: deploy
