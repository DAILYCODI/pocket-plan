  const visibleChecks=[...checks,...state.paychecks.filter(p=>p.receivedDate?.startsWith(month)&&!p.scheduledDate.startsWith(month))].sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));
  return header('A place for every paycheck.',`Expected dates and actual deposits · ${monthLabel()}`,'Add schedule','source')+plannerPanel()+
  `<div class="notice"><div><strong>${state.settings.incomeMode==='paychecks'?'Your budget uses received paychecks.':'Your budget still uses your monthly base income.'}</strong><p>Expected checks are a plan. Mark each deposit received when it arrives. Log a deposit here or as extra income, never both.</p></div><button class="button secondary" data-action="income-mode">${state.settings.incomeMode==='paychecks'?'Use monthly base':'Use paychecks'}</button></div>`+
  `<div class="stats">${stat('Expected pay',money(expected),'Scheduled for this calendar month',true)}${stat('Pay received',money(received),'By actual deposit date')}${stat('Awaiting deposit',String(checks.filter(p=>!p.receivedDate).length),'Scheduled checks not yet marked received')}${stat('Income schedules',String(state.sources.length),'Weekly, biweekly, semi-monthly, monthly')}</div>`+
  `<section class="panel"><div class="panel-head"><h2>${monthLabel()} paychecks</h2><button class="textbutton" data-action="oneoff-pay">＋ One-time check</button></div>${visibleChecks.map(p=>`<div class="paycheck-row"><div class="row-title"><span class="badge green">${new Date(p.scheduledDate+'T12:00:00').getDate()}</span><div><strong>${esc(p.name)}</strong><small>Expected ${dateLabel(p.scheduledDate)} · ${money(p.expectedAmount)}</small>${p.receivedDate?`<small class="positive">Received ${dateLabel(p.receivedDate)} · ${money(p.actualAmount)}</small>`:`<small>${p.scheduledDate<today?'Not marked received':'Upcoming'}</small>`}</div></div><div class="inline-actions"><button class="smallbtn" data-action="receive-pay" data-id="${payKey(p)}">${p.receivedDate?'Edit deposit':'Mark received'}</button>${p.id?`<button class="smallbtn remove" data-action="delete-pay" data-id="${esc(p.id)}" aria-label="Delete or undo ${esc(p.name)}">×</button>`:''}</div></div>`).join('')||empty('Start with your pay schedule.','Choose semi-monthly for two pay dates each month, or add a one-time check.')}<p class="hint">A deposit received in another month counts as income in that actual month. Changing a schedule affects expected dates; recorded deposits are kept.</p></section>`+
  `<section class="panel" style="margin-top:22px"><div class="panel-head"><h2>Your income schedules</h2></div>${state.sources.map(s=>`<div class="row"><div class="row-title"><div><strong>${esc(s.name)}</strong><small>${frequencyLabels[s.frequency]}${s.frequency==='semimonthly'?` · Days ${s.day1} & ${s.day2===31?'last':s.day2}`:''}</small></div></div><div class="inline-actions"><button class="smallbtn" data-action="edit-source" data-id="${esc(s.id)}">Edit</button><button class="smallbtn remove" data-action="delete-source" data-id="${esc(s.id)}" aria-label="Delete ${esc(s.name)}">×</button></div></div>`).join('')||empty('No recurring income schedules.','One-time checks work without a schedule.')}<p class="hint">Semi-monthly means 24 scheduled checks a year. Every two weeks follows a 14-day cycle. Day 31 means the last day of each month; other unavailable dates move to month-end. Weekends and holidays are not shifted automatically.</p></section>`;
}
function savings(){
  const m=E.monthly(state,month),total=E.sum(state.savings.map(f=>E.savingsBalance(f,state.savingsMoves)));
  const moves=state.savingsMoves.filter(x=>x.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date));
  return header('Give your savings a purpose.','Separate funds, even inside the same bank account.','Add fund','fund')+
    `<div class="stats">${stat('Total savings',money(total),'Current total of your tracked funds',true)}${stat('Moved to savings',money(m.savingsIn),`Transfers · ${monthLabel()}`)}${stat('Moved out of savings',money(m.savingsOut),'Transfers back to spending money')}${stat('Savings funds',String(state.savings.length),'Track each saved dollar in one fund')}</div>`+
    `<div class="debt-cards">${state.savings.map(f=>{const balance=E.savingsBalance(f,state.savingsMoves),pct=f.target?Math.min(100,Math.round(balance/f.target*100)):0;return `<article class="debt-card"><div class="panel-head"><h2>${esc(f.name)}</h2><span class="tag">${f.target?pct+'% of target':'Savings fund'}</span></div><small>${esc(f.account||'No bank account label')}</small><div class="balance">${money(balance)}</div><small>${f.target?'Target '+money(f.target):'Current tracked balance'}</small>${f.target?`<div class="progress"><i style="width:${pct}%"></i></div>`:''}<div class="debt-actions" style="margin-top:20px"><button class="button secondary" data-action="fund-deposit" data-id="${esc(f.id)}">＋ Add money</button><button class="textbutton" data-action="fund-withdraw" data-id="${esc(f.id)}">Withdraw</button><button class="textbutton" data-action="edit-fund" data-id="${esc(f.id)}">Edit</button><button class="textbutton remove" data-action="delete-fund" data-id="${esc(f.id)}">Delete</button></div></article>`;}).join('')||`<section class="panel">${empty('Emergency fund. Moving fund. Your next goal.','Add separate funds with starting balances and optional targets.')}</section>`}</div>`+
    `<section class="panel"><div class="panel-head"><h2>Savings activity</h2><span class="tag">${monthLabel()}</span></div>${moves.map(x=>{const fund=state.savings.find(f=>f.id===x.fundId);return `<div class="row"><div class="row-title"><div><strong>${esc(fund.name)}</strong><small>${dateLabel(x.date)} · ${x.kind==='transfer'?'Transfer':'Balance adjustment'}${x.note?' · '+esc(x.note):''}</small></div></div><div class="right"><strong class="${x.type==='deposit'?'positive':''}">${x.type==='deposit'?'+':'−'}${money(x.amount)}</strong><button class="smallbtn remove" data-action="delete-move" data-id="${esc(x.id)}" aria-label="Delete savings entry">×</button></div></div>`;}).join('')||empty('No savings entries this month.','Starting balances appear above; new deposits and withdrawals appear here.')}<p class="hint">Transfers move money between spending and savings in your plan; they are not expenses or income. Balance adjustments only reconcile savings. Entries track money you move yourself; the app does not move bank funds. Do not also log the same transfer as an expense.</p></section>`;
}
function sourceForm(id){
  const s=state.sources.find(x=>x.id===id),days=Array.from({length:31},(_,i)=>[String(i+1),i===30?'Last day of month':String(i+1)]);
  openForm(s?'Edit pay schedule':'Add a pay schedule','Choose when you expect to be paid. Semi-monthly supports different amounts for the two checks.',
    input('Income source','name',s?.name||'','text','maxlength="100"')+
    select('Frequency','frequency',Object.entries(frequencyLabels),s?.frequency||'semimonthly')+
    input('Expected net amount / first check ($)','amount',dollars(s?.amount||0),'number','min="0" max="10000000000" step="0.01"')+
    `<div id="second-amount">${input('Second check amount ($)','amount2',dollars(s?.amount2||s?.amount||0),'number','min="0" max="10000000000" step="0.01"')}</div>`+
    `<div id="first-pay-day">${select('Pay day / first pay day','day1',days,String(s?.day1||15))}</div><div id="second-pay-day">${select('Second pay day','day2',days,String(s?.day2||31))}</div>`+
    input('Schedule start / next payday','startDate',s?.startDate||month+'-01','date')+
    `<p class="hint full" style="grid-column:1/-1">For weekly/biweekly pay, the start date anchors the cycle. For semi-monthly pay, the first day must be 1–27 and before the second day so both checks remain distinct in February.</p>`,f=>{
      const item={id:s?.id||uid(),name:f.get('name').trim(),frequency:f.get('frequency'),amount:cash(f,'amount'),amount2:cash(f,'amount2'),day1:Number(f.get('day1')),day2:Number(f.get('day2')),startDate:f.get('startDate')};
      if(!item.name)throw Error('Enter an income source.');
      if(s)state.sources[state.sources.findIndex(x=>x.id===s.id)]=item;else state.sources.push(item);
    });
  const control=$('#modal select[name=frequency]');
  const update=()=>{const semi=control.value==='semimonthly';$('#second-amount').hidden=!semi;$('#second-pay-day').hidden=!semi;$('#first-pay-day').hidden=!semi&&control.value!=='monthly';};control.onchange=update;update();
}
function receivePay(key){
  const k=JSON.parse(key),existing=state.paychecks.find(p=>p.id===k.id),source=state.sources.find(s=>s.id===k.sourceId);
  const scheduled=existing||E.checksForMonth(state,k.date.slice(0,7)).find(p=>p.sourceId===k.sourceId&&p.scheduledDate===k.date);
  if(!scheduled)throw Error('Paycheck not found.');
  openForm(existing?.receivedDate?'Edit paycheck deposit':'Mark paycheck received','This actual deposit is counted on the date you received it, when paycheck income mode is enabled.',
    input('Actual deposited amount ($)','actualAmount',dollars(existing?.actualAmount??scheduled.expectedAmount),'number','min="0" max="10000000000" step="0.01"')+
    input('Actual deposit date','receivedDate',existing?.receivedDate||(k.date>today?today:k.date),'date',`max="${today}"`),f=>{
      const record={id:existing?.id||uid(),sourceId:k.sourceId,scheduledDate:scheduled.scheduledDate,expectedAmount:scheduled.expectedAmount,name:scheduled.name||source.name,receivedDate:f.get('receivedDate'),actualAmount:cash(f,'actualAmount')};
      if(existing)state.paychecks[state.paychecks.findIndex(x=>x.id===existing.id)]=record;else state.paychecks.push(record);
    });
}
function oneoffPay(){openForm('Add a one-time paycheck','Plan irregular income here. Mark it received after it arrives.',input('Income description','name','','text','maxlength="100"')+input('Expected amount ($)','expectedAmount','','number','min="0" max="10000000000" step="0.01"')+input('Expected pay date','scheduledDate',today,'date'),f=>{const name=f.get('name').trim();if(!name)throw Error('Enter an income description.');state.paychecks.push({id:uid(),sourceId:null,name,scheduledDate:f.get('scheduledDate'),expectedAmount:cash(f,'expectedAmount'),receivedDate:null,actualAmount:null});});}
function fundForm(id){
  const fund=state.savings.find(f=>f.id===id);
  openForm(fund?'Edit savings fund':'Add a savings fund','Give each saved dollar one home. Multiple funds can share a bank account label.',
    input('Fund name','name',fund?.name||'','text','maxlength="100"')+
    input('Bank account label (or Unspecified)','account',fund?.account||'Unspecified','text','maxlength="100"')+
    input('Starting balance ($)','balance',dollars(fund?.balance||0),'number','min="0" max="10000000000" step="0.01"')+
    input('Target amount ($; 0 for none)','target',dollars(fund?.target||0),'number','min="0" max="10000000000" step="0.01"')+
    `<p class="hint full" style="grid-column:1/-1">Use the starting balance for money already saved. Later entries add to or subtract from it. Editing it adjusts your tracked baseline, without changing monthly spending.</p>`,f=>{const name=f.get('name').trim();if(!name)throw Error('Enter a fund name.');const item={id:fund?.id||uid(),name,account:f.get('account').trim(),balance:cash(f,'balance'),target:cash(f,'target')};if(fund)state.savings[state.savings.findIndex(x=>x.id===fund.id)]=item;else state.savings.push(item);});
}
function savingsMove(id,type){
  const fund=state.savings.find(f=>f.id===id);
  openForm(type==='deposit'?'Add money to '+esc(fund.name):'Withdraw from '+esc(fund.name),'Record money you moved yourself. Savings transfers do not count as spending.',
    input('Amount ($)','amount','','number','min="0.01" max="10000000000" step="0.01"')+
    input('Transfer date','date',today,'date',`max="${today}"`)+
    select('How this affects the budget','kind',[['transfer',type==='deposit'?'From spending money → savings':'Savings → spending money'],['adjustment','Savings balance adjustment only']],'transfer')+
    input('Note (use Transfer if none)','note','Transfer','text','maxlength="100"'),f=>{const amount=cash(f,'amount');if(!amount)throw Error('Enter an amount above zero.');state.savingsMoves.push({id:uid(),fundId:id,type,kind:f.get('kind'),amount,date:f.get('date'),note:f.get('note').trim()});});
}
function extraAction(act,id){
  const actions=['source','edit-source','delete-source','oneoff-pay','receive-pay','delete-pay','income-mode','fund','edit-fund','delete-fund','fund-deposit','fund-withdraw','delete-move'];
  if(!actions.includes(act))return false;
  if(corruptStored){showToast('Restore a valid backup or reset in Settings first.');return true;}
  try{
    if(act==='source'||act==='edit-source')sourceForm(id);
    if(act==='oneoff-pay')oneoffPay();
    if(act==='receive-pay')receivePay(id);
    if(act==='fund'||act==='edit-fund')fundForm(id);
    if(act==='fund-deposit')savingsMove(id,'deposit');
    if(act==='fund-withdraw')savingsMove(id,'withdrawal');
    if(act==='income-mode'&&confirm(state.settings.incomeMode==='monthly'?'Use actual received paychecks instead of the monthly base? Previously logged extra income remains included. Avoid recording the same paycheck twice.':'Switch back to the monthly base income in Settings? Paycheck records will be kept.')){state.settings.incomeMode=state.settings.incomeMode==='monthly'?'paychecks':'monthly';save();render();}
    if(act==='delete-source'){
      if(state.paychecks.some(p=>p.sourceId===id)){showToast('Undo this schedule’s recorded deposits before deleting it.');return true;}
      if(confirm('Delete this income schedule?')){state.sources=state.sources.filter(s=>s.id!==id);save();render();}
    }
    if(act==='delete-pay'&&confirm('Delete this one-time check or undo this recorded deposit? Received income totals will update.')){state.paychecks=state.paychecks.filter(p=>p.id!==id);save();render();}
    if(act==='delete-fund'){
      if(state.savingsMoves.some(m=>m.fundId===id)){showToast('Delete this fund’s savings entries first.');return true;}
      if(confirm('Delete this savings fund and its starting balance?')){state.savings=state.savings.filter(f=>f.id!==id);save();render();}
    }
    if(act==='delete-move'&&confirm('Delete this savings entry? Balances and transfer totals will update.')){
      const proposed=JSON.parse(JSON.stringify(state));proposed.savingsMoves=proposed.savingsMoves.filter(m=>m.id!==id);validate(proposed);state=proposed;save();render();
    }
  }catch(error){showToast(error.message);}
  return true;
}
</script><script>/* Current valuation tracking and explicit, immutable historical snapshots. */
const assetCategories=['Cash / checking','Investments','Retirement','Property','Vehicle','Other asset'];
const liabilityCategories=['Mortgage','Other loan','Credit balance','Other liability'];
function validateNetWorth(s){
  const n=s.netWorth,cents=v=>Number.isSafeInteger(v)&&v>=0&&v<=1e12;
  if(!n||typeof n.includeSavings!=='boolean')throw Error('Invalid net worth settings.');
  for(const key of ['assets','liabilities','snapshots','excludedDebtIds'])if(!Array.isArray(n[key])||n[key].length>10000)throw Error('Invalid net worth records.');
  for(const key of ['assets','liabilities','snapshots']){
    const records=n[key];if(new Set(records.map(r=>r.id)).size!==records.length)throw Error('Duplicate net worth record IDs.');
    for(const r of records)if(typeof r.id!=='string'||!r.id||r.id.length>120)throw Error('Invalid net worth record ID.');
  }
  for(const key of ['assets','liabilities'])for(const a of n[key])if(typeof a.name!=='string'||!a.name.trim()||a.name.length>100||!cents(a.value)||!(key==='assets'?assetCategories:liabilityCategories).includes(a.category)||!validDate(a.updatedDate)||a.updatedDate>today)throw Error('Invalid asset or liability valuation.');
  if(new Set(n.excludedDebtIds).size!==n.excludedDebtIds.length||n.excludedDebtIds.some(id=>!s.debts.some(d=>d.id===id)))throw Error('Invalid excluded debt reference.');
  if(new Set(n.snapshots.map(p=>p.date)).size!==n.snapshots.length)throw Error('Duplicate net worth snapshot dates.');
  for(const p of n.snapshots)if(!validDate(p.date)||p.date>today||!cents(p.assets)||!cents(p.liabilities)||!Number.isSafeInteger(p.total)||p.total!==p.assets-p.liabilities)throw Error('Invalid net worth snapshot.');
  const total=E.netWorth(s);if(!Number.isSafeInteger(total.assets)||!Number.isSafeInteger(total.liabilities)||total.assets>1e12||total.liabilities>1e12)throw Error('Net worth totals exceed the supported amount.');
}
function worthChart(points){
  if(points.length<2)return empty('Your history starts with a snapshot.','Save today’s values, then save another snapshot after your next update.');
  const values=points.map(p=>p.total),min=Math.min(...values,0),max=Math.max(...values,0),range=Math.max(max-min,100),left=Date.parse(points[0].date),span=Math.max(Date.parse(points.at(-1).date)-left,86400000),y=v=>130-(v-min)/range*110;
  const coords=points.map(p=>`${10+(Date.parse(p.date)-left)/span*540},${y(p.total)}`).join(' ');
  return `<div class="chart" role="img" aria-label="Net worth snapshots from ${esc(money(points[0].total))} on ${esc(points[0].date)} to ${esc(money(points.at(-1).total))} on ${esc(points.at(-1).date)}"><svg viewBox="0 0 560 150" preserveAspectRatio="none"><path d="M10 ${y(0)}H550" stroke="#c7ccc4" stroke-dasharray="4 5"/><polyline points="${coords}" fill="none" stroke="#8d79bc" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${points.map(p=>`<circle cx="${10+(Date.parse(p.date)-left)/span*540}" cy="${y(p.total)}" r="3.5" fill="#8d79bc"/>`).join('')}</svg></div><div class="chart-labels"><span>${esc(points[0].date)}</span><span>Dashed line = $0</span><span>${esc(points.at(-1).date)}</span></div>`;
}
function worthRecordRows(key){
  return state.netWorth[key].map(a=>`<div class="row"><div class="row-title"><div><strong>${esc(a.name)}</strong><small>${esc(a.category)} · As of ${esc(a.updatedDate)}</small></div></div><div class="right"><strong>${money(a.value)}</strong><div class="inline-actions"><button class="smallbtn" data-action="edit-${key}" data-id="${esc(a.id)}" aria-label="Edit ${esc(a.name)}">Edit</button><button class="smallbtn remove" data-action="delete-${key}" data-id="${esc(a.id)}" aria-label="Delete ${esc(a.name)}">×</button></div></div></div>`).join('');
}
function networth(){
  const n=state.netWorth,t=E.netWorth(state),points=[...n.snapshots].sort((a,b)=>a.date.localeCompare(b.date)),first=points[0],delta=first?t.total-first.total:0;
  return header('See your whole financial picture.','Current assets minus current liabilities. Income and monthly bills are not balances.','Add asset','asset')+
    `<div class="stats">${stat('Net worth',money(t.total),'Assets − liabilities · current estimate',true)}${stat('Total assets',money(t.assets),'Manual asset values + included savings')}${stat('Total liabilities',money(t.liabilities),'Included tracked debts + other liabilities')}${stat('Change since first snapshot',first?(delta>=0?'+':'−')+money(Math.abs(delta)):'—',first?'Compared with '+first.date:'Save a snapshot to start tracking',false,delta<0)}</div>`+
    `<div class="grid"><section class="panel"><div class="panel-head"><h2>Net worth over time</h2><button class="textbutton" data-action="worth-snapshot">Save today’s snapshot</button></div>${worthChart(points)}<p class="hint">History uses only snapshots you save. Later edits never rewrite past snapshots. Current totals use your latest entered valuations, which may be from different dates.</p></section><section class="panel"><div class="panel-head"><h2>What’s included</h2><span class="tag">Current balances</span></div><div class="row"><div class="row-title"><div><strong>Linked savings funds</strong><small>${n.includeSavings?'Included once from Savings':'Excluded from net worth'}</small></div></div><strong>${money(t.savings)}</strong></div><div class="row"><span>Other assets</span><strong>${money(t.manualAssets)}</strong></div><div class="row"><span>Included tracked debts</span><strong>${money(t.linkedDebts)}</strong></div><div class="row"><span>Other liabilities</span><strong>${money(t.manualLiabilities)}</strong></div><p class="hint">Cash, investments, retirement, property, and vehicle values are entered manually. Updating a valuation does not create income or spending. For transfers to savings, also update any manually entered source-account balance before saving a snapshot.</p></section></div>`+
    `<div class="grid"><section class="panel"><div class="panel-head"><h2>Assets</h2><button class="textbutton" data-action="asset">＋ Add</button></div><div class="row"><div class="row-title"><div><strong>Savings funds · linked</strong><small>Managed in Savings; do not re-enter below.</small></div></div><div class="right"><strong>${money(E.sum(state.savings.map(f=>E.savingsBalance(f,state.savingsMoves))))}</strong><button class="smallbtn" data-action="worth-savings-toggle">${n.includeSavings?'Exclude':'Include'}</button></div></div>${worthRecordRows('assets')||empty('Add the other things you own.','Checking cash, investments, retirement, property, or a vehicle.')}<p class="hint">For property or a financed vehicle, enter its full estimated value here and track the loan separately. Don’t enter equity and then subtract the loan again. If a bank account contains your linked savings funds, enter only its remaining untracked cash.</p></section>`+
    `<section class="panel"><div class="panel-head"><h2>Liabilities</h2><button class="textbutton" data-action="liability">＋ Add other</button></div>${state.debts.map(d=>`<div class="row"><div class="row-title"><div><strong>${esc(d.name)}</strong><small>Linked debt · ${E.debtTerms(d).type==='lease'?'Lease · excluded by type':n.excludedDebtIds.includes(d.id)?'Excluded':'Included'}</small></div></div><div class="right"><strong>${money(E.balance(d,state.transactions))}</strong><button class="smallbtn" data-action="worth-debt-toggle" data-id="${esc(d.id)}" ${E.debtTerms(d).type==='lease'?'disabled':''}>${E.debtTerms(d).type==='lease'?'Lease':n.excludedDebtIds.includes(d.id)?'Include':'Exclude'}</button></div></div>`).join('')}${worthRecordRows('liabilities')||(!state.debts.length?empty('Add what you owe.','Debts already tracked in Debt payoff appear automatically. Add only other liabilities here.'):'')}<p class="hint">Linked debts use tracked principal balances; they do not add unrecorded interest or fees. Inclusion controls affect net worth only. Review contract obligations, such as leases, separately before including them. Do not also add a linked debt as another liability.</p></section></div>`+
    `<section class="panel"><div class="panel-head"><h2>Saved snapshots</h2><span class="tag">All dates · ${points.length} saved</span></div>${points.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Assets</th><th>Liabilities</th><th>Net worth</th><th></th></tr></thead><tbody>${[...points].reverse().map(p=>`<tr><td>${esc(p.date)}</td><td>${money(p.assets)}</td><td>${money(p.liabilities)}</td><td class="${p.total<0?'negative':''}">${money(p.total)}</td><td><button class="smallbtn remove" data-action="delete-worth-snapshot" data-id="${esc(p.id)}" aria-label="Delete snapshot ${esc(p.date)}">×</button></td></tr>`).join('')}</tbody></table></div>`:empty('No snapshots saved yet.','Save one after checking your current balances and asset values.')}</section>`;
}
function worthRecordForm(key,id){
  const record=state.netWorth[key].find(a=>a.id===id),asset=key==='assets';
  openForm((record?'Edit ':'Add ')+(asset?'asset':'liability'),asset?'Enter the current full value. Savings already linked above should not be entered again.':'Add only liabilities that are not already linked from Debt payoff.',
    input('Name','name',record?.name||'','text','maxlength="100"')+
    select('Category','category',(asset?assetCategories:liabilityCategories).map(c=>[c,c]),record?.category||(asset?assetCategories[0]:liabilityCategories[0]))+
    input(asset?'Current estimated value ($)':'Current amount owed ($)','value',dollars(record?.value||0),'number','min="0" max="10000000000" step="0.01"')+
    input('Valuation / statement date','updatedDate',record?.updatedDate||today,'date',`max="${today}"`),f=>{
      const item={id:record?.id||uid(),name:f.get('name').trim(),category:f.get('category'),value:cash(f,'value'),updatedDate:f.get('updatedDate')};
      if(!item.name)throw Error('Enter a name.');
      if(record)state.netWorth[key][state.netWorth[key].findIndex(x=>x.id===record.id)]=item;else state.netWorth[key].push(item);
    });
}
function netWorthAction(act,id){
  const actions=['asset','liability','edit-assets','edit-liabilities','delete-assets','delete-liabilities','worth-savings-toggle','worth-debt-toggle','worth-snapshot','delete-worth-snapshot'];
  if(!actions.includes(act))return false;
  if(corruptStored){showToast('Restore a valid backup or reset in Settings first.');return true;}
  try{
    if(act==='asset'||act==='edit-assets'){worthRecordForm('assets',id);return true;}
    if(act==='liability'||act==='edit-liabilities'){worthRecordForm('liabilities',id);return true;}
    const proposed=JSON.parse(JSON.stringify(state)),n=proposed.netWorth;
    if(act==='delete-assets'||act==='delete-liabilities'){
      if(!confirm('Delete this valuation? Saved historical snapshots will stay unchanged.'))return true;

function planningAction(act,id){

  }
  if(act==='delete-pay'&&state.planner.allocations.some(a=>a.paycheckId===id)){showToast('Remove this paycheck’s assignments before deleting its deposit.');return true;}
  if(act==='delete-tx'||act==='delete-move'){
    if(!confirm('Delete this actual entry and its payment links? Reserved funds will become unpaid again.'))return true;
    try{const proposed=JSON.parse(JSON.stringify(state)),recordType=act==='delete-tx'?'transaction':'savings';proposed.planner.payments=proposed.planner.payments.filter(p=>!(p.recordType===recordType&&p.recordId===id));if(act==='delete-tx')proposed.transactions=proposed.transactions.filter(t=>t.id!==id);else proposed.savingsMoves=proposed.savingsMoves.filter(t=>t.id!==id);state=validate(proposed);save();render();}catch(error){showToast(error.message);}return true;
  }
  const actions=['allocation','reserve-allocation','settle-obligation','edit-commitment','planner-cash','paycheck-preview','typed-save-plan','planner-fill','delete-allocation','delete-commitment','unlink-payment'];if(!actions.includes(act))return false;

    if(act==='reserve-allocation'){reserveForm(id);return true;}
    if(act==='settle-obligation'){settleForm(id);return true;}
    if(act==='edit-commitment'){editCommitment(id);return true;}

    if(act==='paycheck-preview'){paycheckPreview(id);return true;}

  }catch(error){showToast(error.message);}return true;
}

  return `<div class="chart" role="img" aria-label="Estimated debt balance from ${esc(money(p.points[0]))} to ${esc(money(p.points.at(-1)))} over ${months} months"><svg viewBox="0 0 560 145" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b8a4df" stop-opacity=".3"/><stop offset="100%" stop-color="#b8a4df" stop-opacity="0"/></linearGradient></defs><path d="M0 15H560M0 72H560M0 128H560" stroke="#edede8" fill="none" stroke-dasharray="4 5"/><polygon points="0,128 ${main} ${last?560:0},128" fill="url(#fade)"/><polyline points="${baseline}" fill="none" stroke="#c4c7c1" stroke-width="2" stroke-dasharray="5 6" vector-effect="non-scaling-stroke"/><polyline points="${main}" fill="none" stroke="#8d79bc" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div><div class="chart-labels"><span>Today</span><span>${last?Math.round(last/2)+' months':''}</span><span>${last?last+' months':'Start your plan'}</span></div>`;
}
function payoffPanel(){const p=projection(),base=projection(0);return `<section class="panel"><div class="panel-head"><h2>Your path to debt free</h2><span class="tag">${state.settings.strategy==='avalanche'?'Highest APR first':'Smallest balance first'}</span></div><div class="metric-row"><div><small>ESTIMATED FINISH</small><strong>${targetDate(p.months)}</strong></div><div><small>EXTRA PER MONTH</small><strong>${money(state.settings.extra)}</strong></div></div><div class="legend"><span><i class="dot"></i>Your plan</span><span><i class="dot gray"></i>No extra payment</span></div>${chart(p,base)}<p class="hint">${p.months===null?'This payment plan does not clear all debt within 50 years. Increase payments or adjust the plan.':'Estimate uses entered status transitions and APR changes. Loan payments roll over; leases are excluded. New purchases and fees are not modeled.'}</p></section>`;}
function progressPanel(){const starting=E.sum(state.debts.filter(d=>E.debtTerms(d).type!=='lease').map(d=>d.balance)),remaining=E.sum(currentDebts().filter(d=>E.debtTerms(d).type!=='lease').map(d=>d.balance)),repaid=starting-remaining,percent=starting?Math.round(repaid/starting*100):0;return `<section class="panel"><div class="panel-head"><h2>Look how far you’ve come</h2><span class="tag">All time</span></div><div class="donut-wrap"><div class="donut" style="--progress:${percent}%"><div><strong>${percent}%</strong><small>PRINCIPAL PAID</small></div></div><div class="debt-side"><small>Debt remaining</small><strong>${money(remaining)}</strong><div style="height:16px"></div><small>Paid since setup</small><strong class="positive">${money(repaid)}</strong></div></div><p class="hint">Balances reflect your starting amounts minus principal payments you log. Interest is not automatically added to actual balances.</p></section>`;}
function billRows(limit=999){return [...state.bills].sort((a,b)=>a.due-b.due).slice(0,limit).map((b,i)=>`<div class="row"><div class="row-title"><span class="badge ${i%2?'peach':'green'}">${esc(b.name.charAt(0).toUpperCase())}</span><div><strong>${esc(b.name)}</strong><small>${esc(b.category)} · Due day ${b.due}</small></div></div><div class="right">${money(b.amount)}<small>monthly plan</small></div></div>`).join('')||empty('Give every bill a place.','Add recurring expenses in Budget.');}
function txTable(limit=999){const tx=state.transactions.filter(t=>t.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,limit);if(!tx.length)return empty('A fresh page for this month.','Log an expense, income, or debt payment to get started.');return `<div class="table-wrap"><table><thead><tr><th>Activity</th><th>Date</th><th>Amount</th><th><span aria-label="Actions"> </span></th></tr></thead><tbody>${tx.map(t=>`<tr><td><strong>${esc(t.name)}</strong><small>${t.type==='payment'?'Debt payment':t.type==='income'?'Extra income':esc(t.category)}</small></td><td>${new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</td><td class="${t.type==='income'?'positive':''}">${t.type==='income'?'+':'−'}${money(t.amount)}</td><td><button class="smallbtn remove" data-action="delete-tx" data-id="${esc(t.id)}" aria-label="Delete ${esc(t.name)}">×</button></td></tr>`).join('')}</tbody></table></div>`;}
function overview(){
  const m=E.monthly(state,month);
  const welcome=state.debts.length||state.bills.length||state.transactions.length||state.settings.income||state.sources.length||state.savings.length?'':`<div class="notice"><div><strong>Your next chapter starts here.</strong><p>Set up your paychecks, add a savings fund, or explore with fictional demo numbers.</p></div><button class="button secondary" data-action="demo">Try demo</button></div>`;
  return header('Your money. One home.',`Your financial overview · ${monthLabel()}`)+welcome+
    `<div class="stats">${stat(state.settings.incomeMode==='paychecks'?'Income received':'Monthly income',money(m.income),incomeCaption(),true)}${stat('Expenses logged',money(m.expenses),'Actual spending this month')}${stat('Debt payments',money(m.payments),'Payments logged this month')}${stat('Unspent income',money(m.remaining),'After spending, debt payments & savings transfers',false,m.remaining<0)}</div>`+
    homeBrief()+homeShortcuts()+
    `<div class="grid"><section class="panel"><div class="panel-head"><h2>Recent activity</h2><button class="textbutton" data-action="view-activity">View all ↗</button></div>${txTable(4)}</section><section class="panel"><div class="panel-head"><h2>Monthly bills</h2><button class="textbutton" data-action="bill">＋ Add</button></div>${billRows(4)}<p class="hint">Planned bills are separate from actual spending. Log expenses when you pay them.</p></section></div>`;
}
function budget(){const m=E.monthly(state,month);const cats=categories.map(c=>({name:c,plan:E.sum(state.bills.filter(b=>b.category===c).map(b=>b.amount)),actual:E.sum(state.transactions.filter(t=>t.type==='expense'&&t.category===c&&t.date.startsWith(month)).map(t=>t.amount))})).filter(c=>c.plan||c.actual);return header('A plan for the everyday.',`Monthly plan compared with logged spending · ${monthLabel()}`,'Add bill','bill')+`<div class="stats">${stat(state.settings.incomeMode==='paychecks'?'Income received':'Monthly income',money(m.income),incomeCaption(),true)}${stat('Planned expenses',money(m.planned),'Recurring bills across all months')}${stat('Debt allocation',money(m.minimums+state.settings.extra),'Current minimums + extra payment')}${stat('Planned leftover',money(m.plannedRemaining),'Expected income − bills − debt plan; before savings',false,m.plannedRemaining<0)}</div><div class="grid"><section class="panel"><div class="panel-head"><h2>Spending by category</h2><span class="tag">Logged / planned</span></div>${cats.map(c=>`<div class="category"><div class="category-amount"><span>${esc(c.name)}</span><strong class="${c.actual>c.plan?'negative':''}">${money(c.actual)} <span class="muted">/ ${money(c.plan)}</span></strong></div><div class="progress"><i style="width:${c.plan?Math.min(100,c.actual/c.plan*100):100}%;background:${c.actual>c.plan?'#c97d73':'#8d79bc'}"></i></div></div>`).join('')||empty('Start with the expenses you know.','Add bills or log expenses to see categories here.')}<p class="hint">Use Savings for deposits and withdrawals; they stay separate from spending. Older Savings-category expenses remain unchanged. Unspent income is a budget calculation, not your bank balance.</p></section><section class="panel"><div class="panel-head"><h2>Recurring expense plan</h2></div>${state.bills.map(b=>`<div class="row"><div class="row-title"><div><strong>${esc(b.name)}</strong><small>${esc(b.category)} · Due day ${b.due}</small></div></div><div class="right">${money(b.amount)}<div class="inline-actions"><button class="smallbtn" data-action="edit-bill" data-id="${esc(b.id)}" aria-label="Edit ${esc(b.name)}">Edit</button><button class="smallbtn remove" data-action="delete-bill" data-id="${esc(b.id)}" aria-label="Delete ${esc(b.name)}">×</button></div></div></div>`).join('')||empty('No monthly bills yet.','Add rent, utilities, groceries, and other planned expenses.')}</section></div>`;}
function activity(){return header('Every entry tells a story.',`Your recorded activity · ${monthLabel()}`)+`<section class="panel"><div class="panel-head"><h2>Monthly activity</h2><span class="tag">${state.transactions.filter(t=>t.date.startsWith(month)).length} entries</span></div>${txTable()}</section>`;}
function render(){ $('#month').value=month;$('#month').hidden=view==='networth';$('#mobile-month').value=month;$('#mobile-month').hidden=view==='networth';$('#demo-indicator').hidden=!state.demo;$('#content').innerHTML=({overview,debts:typedDebts,budget,activity,paychecks,savings,networth,planning})[view]();document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===(b.closest('.mobile-menu')?view:(view==='planning'?'paychecks':view)))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#saved-label').textContent='Pocket Plan 4.2 · '+(state.demo?'Demo numbers · clear them in Settings.':'Local to this browser.');showStorage(); }
function input(label,name,value='',type='text',extra=''){return `<label>${label}<input class="field" name="${name}" type="${type}" value="${esc(value)}" ${extra} required></label>`;}
function select(label,name,options,value){return `<label>${label}<select class="field" name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;}
function openForm(title,subtitle,fields,onSubmit){const dialog=$('#modal');dialog.innerHTML=`<div class="dialog-inner"><button class="close" aria-label="Close dialog" type="button">×</button><h2 id="modal-title">${title}</h2><p class="muted" style="font-size:12px">${subtitle}</p><form><div class="formgrid">${fields}</div><p class="error" role="alert" id="form-error"></p><div class="form-actions"><button class="button secondary" type="button" id="cancel">Cancel</button><button class="button" type="submit">Save</button></div></form></div>`;dialog.querySelector('.close').onclick=()=>dialog.close();$('#cancel').onclick=()=>dialog.close();dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const before=JSON.parse(JSON.stringify(state));try{if(corruptStored)throw Error('Restore a valid backup or reset the app in Settings first.');onSubmit(new FormData(e.target));state=validate(state);save();dialog.close();render();if(!storageIssue)showToast('Saved in this browser.');}catch(err){state=before;$('#form-error').textContent=err.message;}};dialog.showModal();}
const cash=(data,key)=>{const n=Number(data.get(key));if(!Number.isFinite(n)||n<0||n>1e10)throw Error('Please enter a valid nonnegative amount.');return Math.round(n*100);};
function billForm(id){const b=state.bills.find(b=>b.id===id);openForm(b?'Edit monthly bill':'Add a monthly bill','This is a recurring plan. Log an expense separately when you pay it.',input('Bill or expense name','name',b?.name||'','text','maxlength="100"')+input('Planned amount ($)','amount',dollars(b?.amount||0),'number','min="0" max="10000000000" step="0.01"')+select('Category','category',categories.map(c=>[c,c]),b?.category||'Housing')+input('Due day (1–31)','due',b?.due||1,'number','min="1" max="31" step="1"'),f=>{const name=f.get('name').trim();if(!name)throw Error('Enter a bill name.');const item={id:b?.id||uid(),name,amount:cash(f,'amount'),category:f.get('category'),due:Number(f.get('due'))};if(b)state.bills[state.bills.findIndex(x=>x.id===b.id)]=item;else state.bills.push(item);});}
function transactionForm(debtId){const defaultDate=month===today.slice(0,7)?today:month+'-01';openForm(debtId?'Log a debt payment':'Add activity','Extra income excludes paychecks recorded in Paychecks. Log each deposit only once.',select('Type','type',[['expense','Expense'],['income','Extra income'],['payment','Debt payment']],debtId?'payment':'expense')+input('Amount ($)','amount','','number','min="0.01" max="10000000000" step="0.01"')+input('Description','name','','text','maxlength="100"')+input('Date','date',defaultDate>today?today:defaultDate,'date',`max="${today}"`)+`<div id="category-field">${select('Category','category',categories.map(c=>[c,c]),'Other')}</div><div id="debt-field">${select('Debt','debtId',state.debts.map(d=>[d.id,d.name]),debtId)}</div><div id="interest-field">${input('Interest included in payment ($)','interest','0.00','number','min="0" max="10000000000" step="0.01"')}<small style="font-size:10px">Only payment minus interest reduces your debt balance.</small></div>`,f=>{const type=f.get('type'),amount=cash(f,'amount'),selectedDebt=type==='payment'?state.debts.find(d=>d.id===f.get('debtId')):null,interest=type==='payment'&&E.debtTerms(selectedDebt||{}).type!=='lease'?cash(f,'interest'):0,name=f.get('name').trim(),date=f.get('date');if(!name||!amount)throw Error('Enter a description and an amount above zero.');if(!validDate(date)||date>today)throw Error('Use today or an earlier date.');if(interest>amount)throw Error('Interest cannot exceed the payment.');if(type==='payment'){const d=state.debts.find(d=>d.id===f.get('debtId'));if(!d)throw Error('Add a debt before logging its payment.');if(amount-interest>E.balance(d,state.transactions))throw Error('Principal payment exceeds the remaining balance. Check the amount and interest.');}state.transactions.push({id:uid(),type,name,amount,interest,date,category:f.get('category')||'Other',debtId:type==='payment'?f.get('debtId'):null});});const type=$('#modal select[name=type]');const change=()=>{$('#category-field').hidden=type.value!=='expense';$('#debt-field').hidden=type.value!=='payment';$('#interest-field').hidden=type.value!=='payment'||E.debtTerms(state.debts.find(d=>d.id===$('#modal select[name=debtId]').value)||{}).type==='lease';};type.onchange=change;$('#modal select[name=debtId]').onchange=change;change();}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`pocket-plan-backup-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Backup downloaded. Keep it somewhere private.');}
function settings(){openForm('Your settings','A simple foundation for your monthly plan.',select('Income calculation','incomeMode',[['monthly','Monthly base + extra income'],['paychecks','Received paychecks + extra income']],state.settings.incomeMode)+input('Monthly base (ignored in paycheck mode) ($)','income',dollars(state.settings.income),'number','min="0" max="10000000000" step="0.01"')+`<div class="full" style="grid-column:1/-1"><p class="disclaimer">Your data stays in this browser’s storage. It does not sync across devices and is not encrypted by this app. Clearing site data can erase it. Backups contain your financial entries; keep them private and out of your GitHub repository.</p><div class="settings-stack"><button class="button secondary" type="button" data-action="export">Export backup</button><button class="button secondary" type="button" data-action="import">Restore backup</button><button class="button secondary" type="button" data-action="demo">Load fictional demo</button><button class="button danger" type="button" data-action="reset">Reset all data</button></div></div>`,f=>{state.settings.income=cash(f,'income');state.settings.incomeMode=f.get('incomeMode');});}
function demo(){if(corruptStored){showToast('Reset or restore a backup first.');return;}if((state.debts.length||state.bills.length||state.transactions.length||state.settings.income||state.sources.length||state.paychecks.length||state.savings.length||state.netWorth.assets.length||state.netWorth.liabilities.length||state.netWorth.snapshots.length||state.planner.obligations.length)&&!confirm('Replace your current entries with fictional demo data? Export a backup first if you want to keep them.'))return;
  state=blank();state.demo=true;state.settings={income:450000,extra:20000,strategy:'avalanche',incomeMode:'monthly'};state.debts=[{id:uid(),name:'Everyday card',balance:420000,apr:19.9,minimum:12000,due:18},{id:uid(),name:'Personal loan',balance:680000,apr:8.5,minimum:21000,due:5},{id:uid(),name:'Medical balance',balance:120000,apr:0,minimum:10000,due:23}];state.bills=[{id:uid(),name:'Rent',amount:140000,category:'Housing',due:1},{id:uid(),name:'Groceries',amount:45000,category:'Food',due:5},{id:uid(),name:'Utilities',amount:17000,category:'Utilities',due:15},{id:uid(),name:'Car insurance',amount:18000,category:'Insurance',due:20}];state.transactions=[{id:uid(),type:'expense',name:'Rent',amount:140000,interest:0,date:today.slice(0,7)+'-01',category:'Housing',debtId:null},{id:uid(),type:'expense',name:'Weekly groceries',amount:8500,interest:0,date:today,category:'Food',debtId:null},{id:uid(),type:'payment',name:'Everyday card payment',amount:18000,interest:6000,date:today,debtId:state.debts[0].id,category:'Other'}];state.sources=[{id:uid(),name:'Example salary',frequency:'semimonthly',startDate:today.slice(0,7)+'-01',day1:15,day2:31,amount:225000,amount2:225000}];state.savings=[{id:uid(),name:'Emergency fund',account:'Example savings account',balance:100000,target:300000},{id:uid(),name:'Moving fund',account:'Example savings account',balance:50000,target:250000}];month=today.slice(0,7);save();$('#modal').close();render();showToast('Fictional demo loaded. Reset in Settings to start fresh.');}
function action(act,id){
  if(planningAction(act,id)||netWorthAction(act,id)||extraAction(act,id))return;
  if(act==='debt'||act==='edit-debt')debtForm(id);
  if(act==='bill'||act==='edit-bill')billForm(id);
  if(act==='transaction'||act==='payment')transactionForm(id);
  if(act==='view-activity'){setMobileMenu(false);view='activity';render();}
  if(act==='export')exportBackup();
  if(act==='import')$('#import-file').click();
  if(act==='demo')demo();
  if(act==='reset'&&confirm('Erase all Pocket Plan data in this browser? Export a backup first if you want to keep it.')){state=blank();corruptStored=false;save();$('#modal').close();render();}
  if(act==='save-plan'){const extra=Number($('#extra').value);if($('#extra').value===''||!Number.isFinite(extra)||extra<0||extra>1e10){showToast('Enter a valid extra payment.');return;}if(corruptStored){showToast('Reset or restore a backup first.');return;}state.settings.extra=Math.round(extra*100);state.settings.strategy=$('#strategy').value;save();render();showToast(storageIssue?'Export a backup; local saving failed.':'Payoff plan updated.');}
  if(act==='delete-tx'&&confirm('Delete this entry? A debt payment deletion restores its tracked principal.')){state.transactions=state.transactions.filter(t=>t.id!==id);save();render();}
  if(act==='delete-bill'&&confirm('Remove this bill from your monthly plan? Logged expenses stay in Activity.')){state.bills=state.bills.filter(b=>b.id!==id);save();render();}
  if(act==='delete-debt'){if(state.transactions.some(t=>t.debtId===id)){showToast('Delete this debt’s logged payments in Activity first.');return;}if(confirm('Delete this debt and its payoff target?')){state.debts=state.debts.filter(d=>d.id!==id);state.netWorth.excludedDebtIds=state.netWorth.excludedDebtIds.filter(x=>x!==id);save();render();}}
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){setMobileMenu(false);view=nav.dataset.view;render();window.scrollTo(0,0);}const b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset.id);});
$('#month').addEventListener('change',e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){month=e.target.value;render();}});
$('#menu-toggle').onclick=()=>setMobileMenu($('#mobile-menu').hidden);
$('#mobile-settings').onclick=()=>{setMobileMenu(false);settings();};
$('#mobile-export').onclick=()=>{setMobileMenu(false);exportBackup();};
$('#mobile-restore').onclick=()=>{setMobileMenu(false);$('#import-file').click();};
$('#mobile-month').addEventListener('change',e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){month=e.target.value;render();}});
document.addEventListener('click',e=>{if(!e.target.closest('#mobile-menu')&&!e.target.closest('#menu-toggle'))setMobileMenu(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#mobile-menu').hidden)setMobileMenu(false,true);});
$('#settings').onclick=settings;$('#backup').onclick=exportBackup;$('#restore').onclick=()=>$('#import-file').click();
$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10e6)throw Error('Backup is too large (maximum 10 MB).');const imported=validate(JSON.parse(await file.text()));if(!confirm('Replace current entries with this backup?'))return;state=imported;corruptStored=false;save();$('#modal').close();render();showToast(storageIssue?'Loaded in memory. Export a backup before closing.':'Backup restored.');}catch(err){showToast('Could not restore: '+err.message);}finally{e.target.value='';}};
render();
</script></body></html>
