<body><div class="shell"><aside class="sidebar"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#253e36"/><path d="M9 22V10h7a5 5 0 010 10h-3" fill="none" stroke="#def59a" stroke-width="3"/><circle cx="21" cy="22" r="3" fill="#def59a"/></svg>Pocket Plan</div><div class="eyebrow">Your workspace</div><nav class="nav" aria-label="Main navigation"><button data-view="overview" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Overview</button><button data-view="paychecks"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v5M17 3v5M3 11h18M8 16h8"/></svg>Paychecks</button><button data-view="savings"><svg viewBox="0 0 24 24"><path d="M4 10l8-6 8 6M5 11h14M7 11v7M12 11v7M17 11v7M4 21h16"/></svg>Savings</button><button data-view="debts"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 10h16M7 15h4"/></svg>Debt payoff</button><button data-view="budget"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h17M9 16v-5M14 16V7M19 16v-8"/></svg>Budget</button><button data-view="activity"><svg viewBox="0 0 24 24"><path d="M5 4h14v17l-3-2-4 2-4-2-3 2zM8 8h8M8 12h8M8 16h4"/></svg>Activity</button></nav><div class="sidefoot"><strong>A little clarity. Every day.</strong>Your entries stay in this browser.<br>Back up regularly to keep them.</div></aside><main class="main"><header class="topbar"><div class="eyebrow">Small steps. More freedom.<span id="demo-indicator" class="demo-pill" hidden>DEMO DATA</span></div><div class="mobile-name"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#253e36"/><path d="M9 22V10h7a5 5 0 010 10h-3" fill="none" stroke="#def59a" stroke-width="3"/></svg>Pocket Plan</div><div class="top-actions"><label><span class="sr-only" hidden>Dashboard month</span><input type="month" id="month" aria-label="Dashboard month"></label><button class="iconbutton" id="settings" aria-label="Settings and backup"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg></button></div></header><div id="storage-error" role="alert" class="notice"></div><section id="content" aria-label="Dashboard"></section><footer class="footer"><p>Made for progress, one month at a time. <span id="saved-label"></span></p><div><button class="textbutton" id="backup">Export backup ↗</button><button class="textbutton" id="restore">Restore backup</button></div></footer></main></div><dialog id="modal" aria-labelledby="modal-title"></dialog><input type="file" accept="application/json,.json" id="import-file" hidden><div id="toast" role="status" class="toast" hidden></div><script>/* Integer-cent calculations shared by the app and its tests. */
(function(root){
  'use strict';
  const sum = xs => xs.reduce((a,b)=>a+b,0);
  function migrate(s){
    if(s&&s.version===1){s=JSON.parse(JSON.stringify(s));s.version=2;s.settings={...s.settings,incomeMode:'monthly'};s.sources=[];s.paychecks=[];s.savings=[];s.savingsMoves=[];}
    return s;
  }
  function dateForDay(month,day){
    const [year,m]=month.split('-').map(Number),last=new Date(Date.UTC(year,m,0)).getUTCDate();
    return `${month}-${String(Math.min(day,last)).padStart(2,'0')}`;
  }
  function schedule(source,month){
    const dates=[],first=month+'-01',last=dateForDay(month,31),anchor=Date.parse(source.startDate+'T00:00:00Z');
    if(source.frequency==='weekly'||source.frequency==='biweekly'){
      const step=(source.frequency==='weekly'?7:14)*86400000;
      let t=anchor+Math.max(0,Math.ceil((Date.parse(first+'T00:00:00Z')-anchor)/step))*step;
      for(;t<=Date.parse(last+'T00:00:00Z');t+=step)dates.push({date:new Date(t).toISOString().slice(0,10),amount:source.amount});
    }else if(source.frequency==='semimonthly'){
      dates.push({date:dateForDay(month,source.day1),amount:source.amount},{date:dateForDay(month,source.day2),amount:source.amount2});
    }else if(source.frequency==='monthly')dates.push({date:dateForDay(month,source.day1),amount:source.amount});
    return dates.filter(x=>x.date>=source.startDate).map(x=>({...x,sourceId:source.id,name:source.name}));
  }
  function checksForMonth(state,month){
    const records=state.paychecks||[];
    const checks=(state.sources||[]).flatMap(s=>schedule(s,month)).map(p=>{
      const record=records.find(r=>r.sourceId===p.sourceId&&r.scheduledDate===p.date);
      return record?{...record,date:record.scheduledDate}:{...p,scheduledDate:p.date,expectedAmount:p.amount,receivedDate:null,actualAmount:null};
    });
    for(const r of records)if(r.scheduledDate.startsWith(month)&&!checks.some(p=>p.id===r.id))checks.push({...r,date:r.scheduledDate});
    return checks.sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));
  }
  function savingsBalance(fund,moves){return fund.balance+sum(moves.filter(m=>m.fundId===fund.id).map(m=>m.type==='deposit'?m.amount:-m.amount));}
  function balance(debt, transactions){
    return Math.max(0,debt.balance-sum(transactions.filter(t=>t.type==='payment'&&t.debtId===debt.id).map(t=>t.amount-t.interest)));
  }
  function monthly(state, month){
    const tx=state.transactions.filter(t=>t.date.startsWith(month));
    const extraIncome=sum(tx.filter(t=>t.type==='income').map(t=>t.amount));
    const paycheckMode=state.settings.incomeMode==='paychecks';
    const received=sum((state.paychecks||[]).filter(p=>p.receivedDate?.startsWith(month)).map(p=>p.actualAmount));
    const expected=sum(checksForMonth(state,month).map(p=>p.expectedAmount));
    const income=(paycheckMode?received:state.settings.income)+extraIncome;
    const plannedIncome=(paycheckMode?expected:state.settings.income)+extraIncome;
    const moves=(state.savingsMoves||[]).filter(m=>m.kind==='transfer'&&m.date.startsWith(month));
    const savingsIn=sum(moves.filter(m=>m.type==='deposit').map(m=>m.amount)),savingsOut=sum(moves.filter(m=>m.type==='withdrawal').map(m=>m.amount));
    const expenses=sum(tx.filter(t=>t.type==='expense').map(t=>t.amount));
    const payments=sum(tx.filter(t=>t.type==='payment').map(t=>t.amount));
    const planned=sum(state.bills.map(b=>b.amount));
    const minimums=sum(state.debts.filter(d=>balance(d,state.transactions)>0).map(d=>Math.min(d.minimum,balance(d,state.transactions))));
    return {income,expenses,payments,planned,minimums,savingsIn,savingsOut,plannedIncome,remaining:income-expenses-payments-savingsIn+savingsOut,plannedRemaining:plannedIncome-planned-minimums-state.settings.extra};
  }
  function forecast(debts, extra, strategy){
    let items=debts.filter(d=>d.balance>0).map(d=>({...d}));
    const start=sum(items.map(d=>d.balance));
    const budget=sum(items.map(d=>Math.min(d.minimum,d.balance)))+extra;
    let interest=0, months=0;
    const points=[start], paid=[];
    if(!start)return {months:0,interest:0,points,paid,budget};
    if(!budget)return {months:null,interest:0,points,paid,budget};
    while(items.some(d=>d.balance>0)&&months<600){
      months++;
      for(const d of items){ const cost=Math.round(d.balance*d.apr/1200);d.balance+=cost;interest+=cost; }
      let available=budget;
      for(const d of items){const p=Math.min(d.balance,d.minimum,available); d.balance-=p;available-=p;}
      const ordered=[...items].filter(d=>d.balance>0).sort(strategy==='snowball'?(a,b)=>a.balance-b.balance||b.apr-a.apr:(a,b)=>b.apr-a.apr||a.balance-b.balance);
      for(const d of ordered){const p=Math.min(d.balance,available);d.balance-=p;available-=p;}
      for(const d of items)if(d.balance===0&&!paid.some(p=>p.id===d.id))paid.push({id:d.id,name:d.name,month:months});
      points.push(sum(items.map(d=>d.balance)));
    }
    return {months:points.at(-1)===0?months:null,interest,points,paid,budget};
  }
  const api={sum,balance,monthly,forecast,migrate,dateForDay,schedule,checksForMonth,savingsBalance};
  if(typeof module!=='undefined')module.exports=api;else root.BudgetEngine=api;
})(typeof window!=='undefined'?window:globalThis);
</script><script>/* Paycheck and savings features. Loaded before app.js; functions run after state initialization. */
function incomeCaption(){return state.settings.incomeMode==='paychecks'?'Received paychecks + logged extra income':'Monthly base + logged extra income';}
const frequencyLabels={weekly:'Weekly',biweekly:'Every two weeks',semimonthly:'Semi-monthly · twice a month',monthly:'Monthly'};
function validateExtras(s){
  const cents=n=>Number.isSafeInteger(n)&&n>=0&&n<=1e12;
  const id=x=>typeof x.id==='string'&&x.id.length>0&&x.id.length<=120;
  const name=x=>typeof x.name==='string'&&x.name.trim().length>0&&x.name.length<=100;
  const day=d=>Number.isInteger(d)&&d>=1&&d<=31;
  if(!['monthly','paychecks'].includes(s.settings.incomeMode))throw Error('Invalid income calculation mode.');
  for(const k of ['sources','paychecks','savings','savingsMoves']){
    if(!Array.isArray(s[k])||s[k].length>10000)throw Error('Invalid or oversized paycheck/savings records.');
    if(new Set(s[k].map(x=>x.id)).size!==s[k].length)throw Error('Duplicate record IDs.');
  }
  for(const x of s.sources)if(!id(x)||!name(x)||!Object.keys(frequencyLabels).includes(x.frequency)||!cents(x.amount)||!cents(x.amount2)||!day(x.day1)||!day(x.day2)||!validDate(x.startDate)||(x.frequency==='semimonthly'&&(x.day1>=x.day2||x.day1>27)))throw Error('Invalid income schedule. Semi-monthly dates must be distinct in every month.');
  const pairs=new Set();
  for(const p of s.paychecks){
    if(!id(p)||!name(p)||!validDate(p.scheduledDate)||!cents(p.expectedAmount)||(p.sourceId!==null&&!s.sources.some(x=>x.id===p.sourceId)))throw Error('Invalid paycheck record.');
    if(p.receivedDate===null){if(p.actualAmount!==null)throw Error('Pending paycheck cannot have an actual amount.');}
    else if(!validDate(p.receivedDate)||p.receivedDate>today||!cents(p.actualAmount))throw Error('Invalid paycheck deposit.');
    if(p.sourceId!==null){const key=JSON.stringify([p.sourceId,p.scheduledDate]);if(pairs.has(key))throw Error('Duplicate scheduled paycheck.');pairs.add(key);}
  }
  for(const f of s.savings)if(!id(f)||!name(f)||!cents(f.balance)||!cents(f.target)||typeof f.account!=='string'||f.account.length>100)throw Error('Invalid savings fund.');
  for(const m of s.savingsMoves)if(!id(m)||!s.savings.some(f=>f.id===m.fundId)||!cents(m.amount)||!m.amount||!validDate(m.date)||m.date>today||!['deposit','withdrawal'].includes(m.type)||!['transfer','adjustment'].includes(m.kind)||typeof m.note!=='string'||m.note.length>100)throw Error('Invalid savings entry.');
  for(const f of s.savings){let bal=f.balance;const dates=[...new Set(s.savingsMoves.filter(m=>m.fundId===f.id).map(m=>m.date))].sort();for(const date of dates){bal+=E.sum(s.savingsMoves.filter(m=>m.fundId===f.id&&m.date===date).map(m=>m.type==='deposit'?m.amount:-m.amount));if(bal<0||!Number.isSafeInteger(bal))throw Error('Savings history would produce a negative or invalid balance.');}}
}
function dateLabel(date){return new Date(date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function payKey(p){return esc(JSON.stringify({id:p.id||null,sourceId:p.sourceId||null,date:p.scheduledDate}));}
function paychecks(){
  const checks=E.checksForMonth(state,month),received=E.sum(state.paychecks.filter(p=>p.receivedDate?.startsWith(month)).map(p=>p.actualAmount)),expected=E.sum(checks.map(p=>p.expectedAmount));
  const visibleChecks=[...checks,...state.paychecks.filter(p=>p.receivedDate?.startsWith(month)&&!p.scheduledDate.startsWith(month))].sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));
  return header('A place for every paycheck.',`Expected dates and actual deposits · ${monthLabel()}`,'Add schedule','source')+
  `<div class="notice"><div><strong>${state.settings.incomeMode==='paychecks'?'Your budget uses received paychecks.':'Your budget still uses your monthly base income.'}</strong><p>Expected checks are a plan. Mark each deposit received when it arrives. Log a deposit here or as extra income, never both.</p></div><button class="button secondary" data-action="income-mode">${state.settings.incomeMode==='paychecks'?'Use monthly base':'Use paychecks'}</button></div>`+
  `<div class="stats">${stat('Expected pay',money(expected),'Scheduled for this calendar month',true)}${stat('Pay received',money(received),'By actual deposit date')}${stat('Awaiting deposit',String(checks.filter(p=>!p.receivedDate).length),'Scheduled checks not yet marked received')}${stat('Income schedules',String(state.sources.length),'Weekly, biweekly, semi-monthly, monthly')}</div>`+
  `<section class="panel"><div class="panel-head"><h2>${monthLabel()} paychecks</h2><button class="textbutton" data-action="oneoff-pay">＋ One-time check</button></div>${visibleChecks.map(p=>`<div class="paycheck-row"><div class="row-title"><span class="badge green">${new Date(p.scheduledDate+'T12:00:00').getDate()}</span><div><strong>${esc(p.name)}</strong><small>Expected ${dateLabel(p.scheduledDate)} · ${money(p.expectedAmount)}</small>${p.receivedDate?`<small class="positive">Received ${dateLabel(p.receivedDate)} · ${money(p.actualAmount)}</small>`:`<small>${p.scheduledDate<today?'Not marked received':'Upcoming'}</small>`}</div></div><div class="inline-actions"><button class="smallbtn" data-action="receive-pay" data-id="${payKey(p)}">${p.receivedDate?'Edit deposit':'Mark received'}</button>${p.id?`<button class="smallbtn remove" data-action="delete-pay" data-id="${esc(p.id)}" aria-label="Delete or undo ${esc(p.name)}">×</button>`:''}</div></div>`).join('')||empty('Start with your pay schedule.','Choose semi-monthly for two pay dates each month, or add a one-time check.')}<p class="hint">A deposit received in another month counts as income in that actual month. Changing a schedule affects expected dates; recorded deposits are kept.</p></section>`+
  `<section class="panel" style="margin-top:22px"><div class="panel-head"><h2>Your income schedules</h2></div>${state.sources.map(s=>`<div class="row"><div class="row-title"><div><strong>${esc(s.name)}</strong><small>${frequencyLabels[s.frequency]}${s.frequency==='semimonthly'?` · Days ${s.day1} & ${s.day2===31?'last':s.day2}`:''}</small></div></div><div class="inline-actions"><button class="smallbtn" data-action="edit-source" data-id="${esc(s.id)}">Edit</button><button class="smallbtn remove" data-action="delete-source" data-id="${esc(s.id)}" aria-label="Delete ${esc(s.name)}">×</button></div></div>`).join('')||empty('No recurring income schedules.','One-time checks work without a schedule.')}<p class="hint">Semi-monthly means 24 scheduled checks a year. Every two weeks follows a 14-day cycle. Day 31 means the last day of each month; other unavailable dates move to month-end. Weekends and holidays are not shifted automatically.</p></section>`;
}
function savings(){
  const m=E.monthly(state,month),total=E.sum(state.savings.map(f=>E.savingsBalance(f,state.savingsMoves)));
  const moves=state.savingsMoves.filter(x=>x.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date));
  return header('Give your savings a purpose.','Separate funds, even inside the same bank account.','Add fund','fund')+
    `<div class="stats">${stat('Total savings',money(total),'Current total of your tracked funds',true)}${stat('Moved to savings',money(m.savingsIn),`Transfers · ${monthLabel()}`)}${stat('Moved out of savings',money(m.savingsOut),'Transfers back to spending money')}${stat('Savings funds',String(state.savings.length),'Track each saved dollar in one fund')}</div>`+
    `<div class="debt-cards">${state.savings.map(f=>{const balance=E.savingsBalance(f,state.savingsMoves),pct=f.target?Math.min(100,Math.round(balance/f.target*100)):0;return `<article class="debt-card"><div class="panel-head"><h2>${esc(f.name)}</h2><span class="tag">${f.target?pct+'% of target':'Savings fund'}</span></div><small>${esc(f.account||'No bank account label')}</small><div class="balance">${money(balance)}</div><small>${f.target?'Target '+money(f.target):'Current tracked balance'}</small>${f.target?`<div class="progress"><i style="width:${pct}%"></i></div>`:''}<div class="debt-actions" style="margin-top:20px"><button class="button secondary" data-action="fund-deposit" data-id="${esc(f.id)}">＋ Add money</button><button class="textbutton" data-action="fund-withdraw" data-id="${esc(f.id)}">Withdraw</button><button class="textbutton" data-action="edit-fund" data-id="${esc(f.id)}">Edit</button><button class="textbutton remove" data-action="delete-fund" data-id="${esc(f.id)}">Delete</button></div></article>`;}).join('')||`<section class="panel">${empty('Emergency fund. Moving fund. Your next goal.','Add separate funds with starting balances and optional targets.')}</section>`}</div>`+
    `<section class="panel"><div class="panel-head"><h2>Savings activity</h2><span class="tag">${monthLabel()}</span></div>${moves.map(x=>{const fund=state.savings.find(f=>f.id===x.fundId);return `<div class="row"><div class="row-title"><div><strong>${esc(fund.name)}</strong><small>${dateLabel(x.date)} · ${x.kind==='transfer'?'Transfer':'Balance adjustment'}${x.note?' · '+esc(x.note):''}</small></div></div><div class="right"><strong class="${x.type==='deposit'?'positive':''}">${x.type==='deposit'?'+':'−'}${money(x.amount)}</strong><button class="smallbtn remove" data-action="delete-move" data-id="${esc(x.id)}" aria-label="Delete savings entry">×</button></div></div>`;}).join('')||empty('No savings entries this month.','Starting balances appear above; new deposits and withdrawals appear here.')}<p class="hint">Transfers move money between spending and savings in your plan; they are not expenses or income. Balance adjustments only reconcile savings. Entries track money you move yourself; the app does not move bank funds. Do not also log the same transfer as an expense.</p></section>`;
}
function sourceForm(id){
  const s=state.sources.find(x=>x.id===id),days=Array.from({length:31},(_,i)=>[String(i+1),i===30?'Last day of month':String(i+1)]);
  openForm(s?'Edit pay schedule':'Add a pay schedule','Choose when you expect to be paid. Semi-monthly supports different amounts for the two checks.',
    input('Income source','name',s?.name||'','text','maxlength="100"')+
    select('Frequency','frequency',Object.entries(frequencyLabels),s?.frequency||'semimonthly')+
    input('Expected net amount / first check ($)','amount',dollars(s?.amount||0),'number','min="0" max="10000000000" step="0.01"')+
    `<div id="second-amount">${input('Second check amount ($)','amount2',dollars(s?.amount2||s?.amount||0),'number','min="0" max="10000000000" step="0.01"')}</div>`+
    `<div id="first-pay-day">${select('Pay day / first pay day','day1',days,String(s?.day1||15))}</div><div id="second-pay-day">${select('Second pay day','day2',days,String(s?.day2||31))}</div>`+
    input('Schedule start / next payday','startDate',s?.startDate||month+'-01','date')+
    `<p class="hint full" style="grid-column:1/-1">For weekly/biweekly pay, the start date anchors the cycle. For semi-monthly pay, the first day must be 1–27 and before the second day so both checks remain distinct in February.</p>`,f=>{
      const item={id:s?.id||uid(),name:f.get('name').trim(),frequency:f.get('frequency'),amount:cash(f,'amount'),amount2:cash(f,'amount2'),day1:Number(f.get('day1')),day2:Number(f.get('day2')),startDate:f.get('startDate')};
      if(!item.name)throw Error('Enter an income source.');
      if(s)state.sources[state.sources.findIndex(x=>x.id===s.id)]=item;else state.sources.push(item);
    });
  const control=$('#modal select[name=frequency]');
  const update=()=>{const semi=control.value==='semimonthly';$('#second-amount').hidden=!semi;$('#second-pay-day').hidden=!semi;$('#first-pay-day').hidden=!semi&&control.value!=='monthly';};control.onchange=update;update();
}
function receivePay(key){
  const k=JSON.parse(key),existing=state.paychecks.find(p=>p.id===k.id),source=state.sources.find(s=>s.id===k.sourceId);
  const scheduled=existing||E.checksForMonth(state,k.date.slice(0,7)).find(p=>p.sourceId===k.sourceId&&p.scheduledDate===k.date);
  if(!scheduled)throw Error('Paycheck not found.');
  openForm(existing?.receivedDate?'Edit paycheck deposit':'Mark paycheck received','This actual deposit is counted on the date you received it, when paycheck income mode is enabled.',
    input('Actual deposited amount ($)','actualAmount',dollars(existing?.actualAmount??scheduled.expectedAmount),'number','min="0" max="10000000000" step="0.01"')+
    input('Actual deposit date','receivedDate',existing?.receivedDate||(k.date>today?today:k.date),'date',`max="${today}"`),f=>{
      const record={id:existing?.id||uid(),sourceId:k.sourceId,scheduledDate:scheduled.scheduledDate,expectedAmount:scheduled.expectedAmount,name:scheduled.name||source.name,receivedDate:f.get('receivedDate'),actualAmount:cash(f,'actualAmount')};
      if(existing)state.paychecks[state.paychecks.findIndex(x=>x.id===existing.id)]=record;else state.paychecks.push(record);
    });
}
function oneoffPay(){openForm('Add a one-time paycheck','Plan irregular income here. Mark it received after it arrives.',input('Income description','name','','text','maxlength="100"')+input('Expected amount ($)','expectedAmount','','number','min="0" max="10000000000" step="0.01"')+input('Expected pay date','scheduledDate',today,'date'),f=>{const name=f.get('name').trim();if(!name)throw Error('Enter an income description.');state.paychecks.push({id:uid(),sourceId:null,name,scheduledDate:f.get('scheduledDate'),expectedAmount:cash(f,'expectedAmount'),receivedDate:null,actualAmount:null});});}
function fundForm(id){
  const fund=state.savings.find(f=>f.id===id);
  openForm(fund?'Edit savings fund':'Add a savings fund','Give each saved dollar one home. Multiple funds can share a bank account label.',
    input('Fund name','name',fund?.name||'','text','maxlength="100"')+
    input('Bank account label (or Unspecified)','account',fund?.account||'Unspecified','text','maxlength="100"')+
    input('Starting balance ($)','balance',dollars(fund?.balance||0),'number','min="0" max="10000000000" step="0.01"')+
    input('Target amount ($; 0 for none)','target',dollars(fund?.target||0),'number','min="0" max="10000000000" step="0.01"')+
    `<p class="hint full" style="grid-column:1/-1">Use the starting balance for money already saved. Later entries add to or subtract from it. Editing it adjusts your tracked baseline, without changing monthly spending.</p>`,f=>{const name=f.get('name').trim();if(!name)throw Error('Enter a fund name.');const item={id:fund?.id||uid(),name,account:f.get('account').trim(),balance:cash(f,'balance'),target:cash(f,'target')};if(fund)state.savings[state.savings.findIndex(x=>x.id===fund.id)]=item;else state.savings.push(item);});
}
function savingsMove(id,type){
  const fund=state.savings.find(f=>f.id===id);
  openForm(type==='deposit'?'Add money to '+esc(fund.name):'Withdraw from '+esc(fund.name),'Record money you moved yourself. Savings transfers do not count as spending.',
    input('Amount ($)','amount','','number','min="0.01" max="10000000000" step="0.01"')+
    input('Transfer date','date',today,'date',`max="${today}"`)+
    select('How this affects the budget','kind',[['transfer',type==='deposit'?'From spending money → savings':'Savings → spending money'],['adjustment','Savings balance adjustment only']],'transfer')+
    input('Note (use Transfer if none)','note','Transfer','text','maxlength="100"'),f=>{const amount=cash(f,'amount');if(!amount)throw Error('Enter an amount above zero.');state.savingsMoves.push({id:uid(),fundId:id,type,kind:f.get('kind'),amount,date:f.get('date'),note:f.get('note').trim()});});
}
function extraAction(act,id){
  const actions=['source','edit-source','delete-source','oneoff-pay','receive-pay','delete-pay','income-mode','fund','edit-fund','delete-fund','fund-deposit','fund-withdraw','delete-move'];
  if(!actions.includes(act))return false;
  if(corruptStored){showToast('Restore a valid backup or reset in Settings first.');return true;}
  try{
    if(act==='source'||act==='edit-source')sourceForm(id);
    if(act==='oneoff-pay')oneoffPay();
    if(act==='receive-pay')receivePay(id);
    if(act==='fund'||act==='edit-fund')fundForm(id);
    if(act==='fund-deposit')savingsMove(id,'deposit');
    if(act==='fund-withdraw')savingsMove(id,'withdrawal');
    if(act==='income-mode'&&confirm(state.settings.incomeMode==='monthly'?'Use actual received paychecks instead of the monthly base? Previously logged extra income remains included. Avoid recording the same paycheck twice.':'Switch back to the monthly base income in Settings? Paycheck records will be kept.')){state.settings.incomeMode=state.settings.incomeMode==='monthly'?'paychecks':'monthly';save();render();}
    if(act==='delete-source'){
      if(state.paychecks.some(p=>p.sourceId===id)){showToast('Undo this schedule’s recorded deposits before deleting it.');return true;}
      if(confirm('Delete this income schedule?')){state.sources=state.sources.filter(s=>s.id!==id);save();render();}
    }
    if(act==='delete-pay'&&confirm('Delete this one-time check or undo this recorded deposit? Received income totals will update.')){state.paychecks=state.paychecks.filter(p=>p.id!==id);save();render();}
    if(act==='delete-fund'){
      if(state.savingsMoves.some(m=>m.fundId===id)){showToast('Delete this fund’s savings entries first.');return true;}
      if(confirm('Delete this savings fund and its starting balance?')){state.savings=state.savings.filter(f=>f.id!==id);save();render();}
    }
    if(act==='delete-move'&&confirm('Delete this savings entry? Balances and transfer totals will update.')){
      const proposed=JSON.parse(JSON.stringify(state));proposed.savingsMoves=proposed.savingsMoves.filter(m=>m.id!==id);validate(proposed);state=proposed;save();render();
    }
  }catch(error){showToast(error.message);}
  return true;
}
</script><script>'use strict';
const E=BudgetEngine, KEY='pocket-plan-v1', $=s=>document.querySelector(s);
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const today=localDate(), uid=()=>crypto.randomUUID ? crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n/100);
const dollars=n=>(n/100).toFixed(2), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({version:2,demo:false,settings:{income:0,extra:0,strategy:'avalanche',incomeMode:'monthly'},debts:[],bills:[],transactions:[],sources:[],paychecks:[],savings:[],savingsMoves:[]});
const categories=['Housing','Utilities','Food','Transportation','Insurance','Health','Subscriptions','Personal','Savings','Other'];
let state=blank(), view='overview', month=today.slice(0,7), storageIssue='', corruptStored=false;
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(new Date(d+'T12:00:00'))&&new Date(d+'T12:00:00').toISOString().slice(0,10)===d;}
function validate(s){
  s=E.migrate(s);
  if(!s||s.version!==2||typeof s.demo!=='boolean'||!s.settings||!['avalanche','snowball'].includes(s.settings.strategy))throw Error('This is not a supported Pocket Plan backup.');
  const cents=n=>Number.isSafeInteger(n)&&n>=0&&n<=1e12;
  if(!cents(s.settings.income)||!cents(s.settings.extra))throw Error('Invalid income or extra payment.');
  for(const k of ['debts','bills','transactions'])if(!Array.isArray(s[k])||s[k].length>10000)throw Error('Invalid or oversized records.');
  const id=x=>typeof x.id==='string'&&x.id.length>0&&x.id.length<=120;
  const name=x=>typeof x.name==='string'&&x.name.trim().length>0&&x.name.length<=100;
  for(const d of s.debts)if(!id(d)||!name(d)||!cents(d.balance)||!cents(d.minimum)||typeof d.apr!=='number'||!Number.isFinite(d.apr)||d.apr<0||d.apr>100||!Number.isInteger(d.due)||d.due<1||d.due>31)throw Error('Invalid debt record.');
  for(const b of s.bills)if(!id(b)||!name(b)||!cents(b.amount)||!categories.includes(b.category)||!Number.isInteger(b.due)||b.due<1||b.due>31)throw Error('Invalid monthly bill.');
  for(const t of s.transactions)if(!id(t)||!name(t)||!['income','expense','payment'].includes(t.type)||!cents(t.amount)||!t.amount||!cents(t.interest)||t.interest>t.amount||!validDate(t.date)||t.date>today||(t.type==='expense'&&!categories.includes(t.category))||(t.type==='payment'&&!s.debts.some(d=>d.id===t.debtId)))throw Error('Invalid activity record.');
  for(const k of ['debts','bills','transactions'])if(new Set(s[k].map(x=>x.id)).size!==s[k].length)throw Error('Duplicate record IDs.');
  for(const d of s.debts)if(E.sum(s.transactions.filter(t=>t.type==='payment'&&t.debtId===d.id).map(t=>t.amount-t.interest))>d.balance)throw Error('Logged principal payments exceed a starting balance.');
  validateExtras(s);
  return s;
}
try{const raw=localStorage.getItem(KEY);if(raw){try{state=validate(JSON.parse(raw));}catch(e){storageIssue='Saved data could not be loaded. Your stored copy has not been overwritten. Restore a valid backup or use Settings → Reset before making changes.';corruptStored=true;}}}catch(e){storageIssue='Browser storage is unavailable. Entries will only last while this page is open. Export a backup before closing.';}
function save(){
  if(corruptStored){showToast('Restore a backup or reset before saving.');return false;}
  try{validate(state);localStorage.setItem(KEY,JSON.stringify(state));storageIssue='';return true;}catch(e){storageIssue='Changes are only in memory: browser storage is unavailable or full. Export a backup now before closing this page.';showStorage();return false;}
}
function showStorage(){const el=$('#storage-error');el.textContent=storageIssue;el.classList.toggle('show',!!storageIssue);}
function showToast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('#toast').hidden=true,4000);}
function currentDebts(){return state.debts.map(d=>({...d,balance:E.balance(d,state.transactions)}));}
function projection(extra=state.settings.extra){return E.forecast(currentDebts(),extra,state.settings.strategy);}
function targetDate(n){if(n===null)return 'Needs adjustment';if(n===0)return 'Debt free';const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+n);return d.toLocaleDateString('en-US',{month:'short',year:'numeric'});}
function monthLabel(){return new Date(month+'-01T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});}
function stat(label,value,sub,primary=false,negative=false){return `<div class="stat ${primary?'primary':''}"><span class="label">${label}</span><strong class="value ${negative?'negative':''}">${value}</strong><span class="sub">${sub}</span></div>`;}
function header(title,sub,button='Add activity',action='transaction'){return `<div class="intro"><div><h1>${title}</h1><p class="muted">${sub}</p></div><button class="button" data-action="${action}">＋ ${button}</button></div>`;}
function empty(title,sub){return `<div class="empty"><strong>${title}</strong>${sub}</div>`;}
function chart(p,base){
  const max=Math.max(p.points[0],1),last=p.points.length-1,N=560,H=128;
  const coords=points=>{const horizon=Math.max(last,1);return points.slice(0,last+1).map((v,i)=>`${i/horizon*N},${H-v/max*(H-12)}`).join(' ');};
  const main=coords(p.points),baseline=coords(base.points);
  const months=last||1;
  return `<div class="chart" role="img" aria-label="Estimated debt balance from ${esc(money(p.points[0]))} to ${esc(money(p.points.at(-1)))} over ${months} months"><svg viewBox="0 0 560 145" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b8a4df" stop-opacity=".3"/><stop offset="100%" stop-color="#b8a4df" stop-opacity="0"/></linearGradient></defs><path d="M0 15H560M0 72H560M0 128H560" stroke="#edede8" fill="none" stroke-dasharray="4 5"/><polygon points="0,128 ${main} ${last?560:0},128" fill="url(#fade)"/><polyline points="${baseline}" fill="none" stroke="#c4c7c1" stroke-width="2" stroke-dasharray="5 6" vector-effect="non-scaling-stroke"/><polyline points="${main}" fill="none" stroke="#8d79bc" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div><div class="chart-labels"><span>Today</span><span>${last?Math.round(last/2)+' months':''}</span><span>${last?last+' months':'Start your plan'}</span></div>`;
}
function payoffPanel(){const p=projection(),base=projection(0);return `<section class="panel"><div class="panel-head"><h2>Your path to debt free</h2><span class="tag">${state.settings.strategy==='avalanche'?'Highest APR first':'Smallest balance first'}</span></div><div class="metric-row"><div><small>ESTIMATED FINISH</small><strong>${targetDate(p.months)}</strong></div><div><small>EXTRA PER MONTH</small><strong>${money(state.settings.extra)}</strong></div></div><div class="legend"><span><i class="dot"></i>Your plan</span><span><i class="dot gray"></i>No extra payment</span></div>${chart(p,base)}<p class="hint">${p.months===null?'This payment plan does not clear all debt within 50 years. Increase payments or adjust the plan.':'Estimate uses fixed APRs, monthly interest, and rolled-over payments. No new purchases or fees.'}</p></section>`;}
function progressPanel(){const starting=E.sum(state.debts.map(d=>d.balance)),remaining=E.sum(currentDebts().map(d=>d.balance)),repaid=starting-remaining,percent=starting?Math.round(repaid/starting*100):0;return `<section class="panel"><div class="panel-head"><h2>Look how far you’ve come</h2><span class="tag">All time</span></div><div class="donut-wrap"><div class="donut" style="--progress:${percent}%"><div><strong>${percent}%</strong><small>PRINCIPAL PAID</small></div></div><div class="debt-side"><small>Debt remaining</small><strong>${money(remaining)}</strong><div style="height:16px"></div><small>Paid since setup</small><strong class="positive">${money(repaid)}</strong></div></div><p class="hint">Balances reflect your starting amounts minus principal payments you log. Interest is not automatically added to actual balances.</p></section>`;}
function billRows(limit=999){return [...state.bills].sort((a,b)=>a.due-b.due).slice(0,limit).map((b,i)=>`<div class="row"><div class="row-title"><span class="badge ${i%2?'peach':'green'}">${esc(b.name.charAt(0).toUpperCase())}</span><div><strong>${esc(b.name)}</strong><small>${esc(b.category)} · Due day ${b.due}</small></div></div><div class="right">${money(b.amount)}<small>monthly plan</small></div></div>`).join('')||empty('Give every bill a place.','Add recurring expenses in Budget.');}
function txTable(limit=999){const tx=state.transactions.filter(t=>t.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,limit);if(!tx.length)return empty('A fresh page for this month.','Log an expense, income, or debt payment to get started.');return `<div class="table-wrap"><table><thead><tr><th>Activity</th><th>Date</th><th>Amount</th><th><span aria-label="Actions"> </span></th></tr></thead><tbody>${tx.map(t=>`<tr><td><strong>${esc(t.name)}</strong><small>${t.type==='payment'?'Debt payment':t.type==='income'?'Extra income':esc(t.category)}</small></td><td>${new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</td><td class="${t.type==='income'?'positive':''}">${t.type==='income'?'+':'−'}${money(t.amount)}</td><td><button class="smallbtn remove" data-action="delete-tx" data-id="${esc(t.id)}" aria-label="Delete ${esc(t.name)}">×</button></td></tr>`).join('')}</tbody></table></div>`;}
function overview(){const m=E.monthly(state,month);return header('Make room for what matters.',`Your money at a glance · ${monthLabel()}`)+(state.debts.length||state.bills.length||state.transactions.length||state.settings.income||state.sources.length||state.savings.length?'':`<div class="notice"><div><strong>Your next chapter starts here.</strong><p>Set your income in Settings, add a debt, or explore with fictional demo numbers.</p></div><button class="button secondary" data-action="demo">Try demo</button></div>`)+`<div class="stats">${stat(state.settings.incomeMode==='paychecks'?'Income received':'Monthly income',money(m.income),incomeCaption(),true)}${stat('Expenses logged',money(m.expenses),'Actual spending this month')}${stat('Debt payments',money(m.payments),'Payments logged this month')}${stat('Unspent income',money(m.remaining),'After spending, debt payments & savings transfers',false,m.remaining<0)}</div><div class="grid">${payoffPanel()}${progressPanel()}</div><div class="grid"><section class="panel"><div class="panel-head"><h2>Recent activity</h2><button class="textbutton" data-action="view-activity">View all ↗</button></div>${txTable(4)}</section><section class="panel"><div class="panel-head"><h2>Monthly bills</h2><button class="textbutton" data-action="bill">＋ Add</button></div>${billRows(4)}<p class="hint">Planned bills are separate from actual spending. Log expenses when you pay them.</p></section></div>`;}
function debts(){const current=currentDebts(),total=E.sum(current.map(d=>d.balance)),p=projection();return header('Less debt. More possibility.','A clear plan for every balance.','Add debt','debt')+`<div class="stats">${stat('Total debt',money(total),'Current tracked principal',true)}${stat('Monthly debt budget',money(p.budget),'Minimums + extra; rolls over after payoff')}${stat('Estimated payoff',p.months===null?'50+ years':p.months+' months',targetDate(p.months))}${stat('Estimated interest',p.months===null?'—':money(p.interest),'Forecast only; excludes fees')}</div><div class="grid"><section class="panel"><div class="panel-head"><h2>Shape your payoff plan</h2><span class="tag">What if?</span></div><div class="plan-controls"><label>Payoff method<select id="strategy" class="field"><option value="avalanche" ${state.settings.strategy==='avalanche'?'selected':''}>Avalanche · highest APR</option><option value="snowball" ${state.settings.strategy==='snowball'?'selected':''}>Snowball · smallest balance</option></select></label><label>Extra monthly payment ($)<input class="field" id="extra" type="number" min="0" max="10000000000" step="0.01" value="${dollars(state.settings.extra)}"></label></div><button class="button" data-action="save-plan">Update plan</button><p class="hint">Avalanche prioritizes higher interest rates. Snowball prioritizes smaller balances. Both keep the total monthly payment steady as debts are cleared.</p></section>${progressPanel()}</div><div class="debt-cards">${state.debts.map(d=>{const bal=E.balance(d,state.transactions),pct=d.balance?Math.round((d.balance-bal)/d.balance*100):100;return `<article class="debt-card"><div class="panel-head"><h2>${esc(d.name)}</h2><span class="tag">${d.apr}% APR</span></div><div class="balance">${money(bal)}</div><small>of ${money(d.balance)} starting balance</small><div class="progress"><i style="width:${pct}%"></i></div><div class="debt-meta"><span>Minimum ${money(d.minimum)}/mo</span><span>Due day ${d.due}</span></div><div class="debt-actions"><button class="button secondary" data-action="payment" data-id="${esc(d.id)}" ${!bal?'disabled':''}>Log payment</button><button class="textbutton" data-action="edit-debt" data-id="${esc(d.id)}">Edit</button><button class="textbutton remove" data-action="delete-debt" data-id="${esc(d.id)}">Delete</button></div></article>`;}).join('')||`<section class="panel">${empty('Your debt-free plan begins with one balance.','Add a debt with its starting balance, APR, and monthly minimum.')}</section>`}</div>${payoffPanel()}`;}
function budget(){const m=E.monthly(state,month);const cats=categories.map(c=>({name:c,plan:E.sum(state.bills.filter(b=>b.category===c).map(b=>b.amount)),actual:E.sum(state.transactions.filter(t=>t.type==='expense'&&t.category===c&&t.date.startsWith(month)).map(t=>t.amount))})).filter(c=>c.plan||c.actual);return header('A plan for the everyday.',`Monthly plan compared with logged spending · ${monthLabel()}`,'Add bill','bill')+`<div class="stats">${stat(state.settings.incomeMode==='paychecks'?'Income received':'Monthly income',money(m.income),incomeCaption(),true)}${stat('Planned expenses',money(m.planned),'Recurring bills across all months')}${stat('Debt allocation',money(m.minimums+state.settings.extra),'Current minimums + extra payment')}${stat('Planned leftover',money(m.plannedRemaining),'Expected income − bills − debt plan; before savings',false,m.plannedRemaining<0)}</div><div class="grid"><section class="panel"><div class="panel-head"><h2>Spending by category</h2><span class="tag">Logged / planned</span></div>${cats.map(c=>`<div class="category"><div class="category-amount"><span>${esc(c.name)}</span><strong class="${c.actual>c.plan?'negative':''}">${money(c.actual)} <span class="muted">/ ${money(c.plan)}</span></strong></div><div class="progress"><i style="width:${c.plan?Math.min(100,c.actual/c.plan*100):100}%;background:${c.actual>c.plan?'#c97d73':'#8d79bc'}"></i></div></div>`).join('')||empty('Start with the expenses you know.','Add bills or log expenses to see categories here.')}<p class="hint">Use Savings for deposits and withdrawals; they stay separate from spending. Older Savings-category expenses remain unchanged. Unspent income is a budget calculation, not your bank balance.</p></section><section class="panel"><div class="panel-head"><h2>Recurring expense plan</h2></div>${state.bills.map(b=>`<div class="row"><div class="row-title"><div><strong>${esc(b.name)}</strong><small>${esc(b.category)} · Due day ${b.due}</small></div></div><div class="right">${money(b.amount)}<div class="inline-actions"><button class="smallbtn" data-action="edit-bill" data-id="${esc(b.id)}" aria-label="Edit ${esc(b.name)}">Edit</button><button class="smallbtn remove" data-action="delete-bill" data-id="${esc(b.id)}" aria-label="Delete ${esc(b.name)}">×</button></div></div></div>`).join('')||empty('No monthly bills yet.','Add rent, utilities, groceries, and other planned expenses.')}</section></div>`;}
function activity(){return header('Every entry tells a story.',`Your recorded activity · ${monthLabel()}`)+`<section class="panel"><div class="panel-head"><h2>Monthly activity</h2><span class="tag">${state.transactions.filter(t=>t.date.startsWith(month)).length} entries</span></div>${txTable()}</section>`;}
function render(){ $('#month').value=month;$('#demo-indicator').hidden=!state.demo;$('#content').innerHTML=({overview,debts,budget,activity,paychecks,savings})[view]();document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#saved-label').textContent='Pocket Plan 2 · '+(state.demo?'Demo numbers · clear them in Settings.':'Local to this browser.');showStorage(); }
function input(label,name,value='',type='text',extra=''){return `<label>${label}<input class="field" name="${name}" type="${type}" value="${esc(value)}" ${extra} required></label>`;}
function select(label,name,options,value){return `<label>${label}<select class="field" name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;}
function openForm(title,subtitle,fields,onSubmit){const dialog=$('#modal');dialog.innerHTML=`<div class="dialog-inner"><button class="close" aria-label="Close dialog" type="button">×</button><h2 id="modal-title">${title}</h2><p class="muted" style="font-size:12px">${subtitle}</p><form><div class="formgrid">${fields}</div><p class="error" role="alert" id="form-error"></p><div class="form-actions"><button class="button secondary" type="button" id="cancel">Cancel</button><button class="button" type="submit">Save</button></div></form></div>`;dialog.querySelector('.close').onclick=()=>dialog.close();$('#cancel').onclick=()=>dialog.close();dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const before=JSON.parse(JSON.stringify(state));try{if(corruptStored)throw Error('Restore a valid backup or reset the app in Settings first.');onSubmit(new FormData(e.target));state=validate(state);save();dialog.close();render();if(!storageIssue)showToast('Saved in this browser.');}catch(err){state=before;$('#form-error').textContent=err.message;}};dialog.showModal();}
const cash=(data,key)=>{const n=Number(data.get(key));if(!Number.isFinite(n)||n<0||n>1e10)throw Error('Please enter a valid nonnegative amount.');return Math.round(n*100);};
function debtForm(id){const d=state.debts.find(d=>d.id===id);openForm(d?'Edit debt':'Add a debt','Starting balance is your baseline. Logged principal payments are subtracted from it.',input('Debt name','name',d?.name||'','text','maxlength="100"')+input('Starting balance ($)','balance',dollars(d?.balance||0),'number','min="0" max="10000000000" step="0.01"')+input('APR (%)','apr',d?.apr||0,'number','min="0" max="100" step="0.01"')+input('Monthly minimum ($)','minimum',dollars(d?.minimum||0),'number','min="0" max="10000000000" step="0.01"')+input('Due day (1–31)','due',d?.due||1,'number','min="1" max="31" step="1"'),f=>{const name=f.get('name').trim();if(!name)throw Error('Enter a debt name.');const balance=cash(f,'balance'),minimum=cash(f,'minimum');const principal=E.sum(state.transactions.filter(t=>t.type==='payment'&&t.debtId===id).map(t=>t.amount-t.interest));if(balance<principal)throw Error('Starting balance cannot be below principal payments already logged. Delete or correct those payments first.');const item={id:d?.id||uid(),name,balance,minimum,apr:Number(f.get('apr')),due:Number(f.get('due'))};if(d)state.debts[state.debts.findIndex(x=>x.id===d.id)]=item;else state.debts.push(item);});}
function billForm(id){const b=state.bills.find(b=>b.id===id);openForm(b?'Edit monthly bill':'Add a monthly bill','This is a recurring plan. Log an expense separately when you pay it.',input('Bill or expense name','name',b?.name||'','text','maxlength="100"')+input('Planned amount ($)','amount',dollars(b?.amount||0),'number','min="0" max="10000000000" step="0.01"')+select('Category','category',categories.map(c=>[c,c]),b?.category||'Housing')+input('Due day (1–31)','due',b?.due||1,'number','min="1" max="31" step="1"'),f=>{const name=f.get('name').trim();if(!name)throw Error('Enter a bill name.');const item={id:b?.id||uid(),name,amount:cash(f,'amount'),category:f.get('category'),due:Number(f.get('due'))};if(b)state.bills[state.bills.findIndex(x=>x.id===b.id)]=item;else state.bills.push(item);});}
function transactionForm(debtId){const defaultDate=month===today.slice(0,7)?today:month+'-01';openForm(debtId?'Log a debt payment':'Add activity','Extra income excludes paychecks recorded in Paychecks. Log each deposit only once.',select('Type','type',[['expense','Expense'],['income','Extra income'],['payment','Debt payment']],debtId?'payment':'expense')+input('Amount ($)','amount','','number','min="0.01" max="10000000000" step="0.01"')+input('Description','name','','text','maxlength="100"')+input('Date','date',defaultDate>today?today:defaultDate,'date',`max="${today}"`)+`<div id="category-field">${select('Category','category',categories.map(c=>[c,c]),'Other')}</div><div id="debt-field">${select('Debt','debtId',state.debts.map(d=>[d.id,d.name]),debtId)}</div><div id="interest-field">${input('Interest included in payment ($)','interest','0.00','number','min="0" max="10000000000" step="0.01"')}<small style="font-size:10px">Only payment minus interest reduces your debt balance.</small></div>`,f=>{const type=f.get('type'),amount=cash(f,'amount'),interest=type==='payment'?cash(f,'interest'):0,name=f.get('name').trim(),date=f.get('date');if(!name||!amount)throw Error('Enter a description and an amount above zero.');if(!validDate(date)||date>today)throw Error('Use today or an earlier date.');if(interest>amount)throw Error('Interest cannot exceed the payment.');if(type==='payment'){const d=state.debts.find(d=>d.id===f.get('debtId'));if(!d)throw Error('Add a debt before logging its payment.');if(amount-interest>E.balance(d,state.transactions))throw Error('Principal payment exceeds the remaining balance. Check the amount and interest.');}state.transactions.push({id:uid(),type,name,amount,interest,date,category:f.get('category')||'Other',debtId:type==='payment'?f.get('debtId'):null});});const type=$('#modal select[name=type]');const change=()=>{$('#category-field').hidden=type.value!=='expense';$('#debt-field').hidden=type.value!=='payment';$('#interest-field').hidden=type.value!=='payment';};type.onchange=change;change();}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`pocket-plan-backup-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Backup downloaded. Keep it somewhere private.');}
function settings(){openForm('Your settings','A simple foundation for your monthly plan.',select('Income calculation','incomeMode',[['monthly','Monthly base + extra income'],['paychecks','Received paychecks + extra income']],state.settings.incomeMode)+input('Monthly base (ignored in paycheck mode) ($)','income',dollars(state.settings.income),'number','min="0" max="10000000000" step="0.01"')+`<div class="full" style="grid-column:1/-1"><p class="disclaimer">Your data stays in this browser’s storage. It does not sync across devices and is not encrypted by this app. Clearing site data can erase it. Backups contain your financial entries; keep them private and out of your GitHub repository.</p><div class="settings-stack"><button class="button secondary" type="button" data-action="export">Export backup</button><button class="button secondary" type="button" data-action="import">Restore backup</button><button class="button secondary" type="button" data-action="demo">Load fictional demo</button><button class="button danger" type="button" data-action="reset">Reset all data</button></div></div>`,f=>{state.settings.income=cash(f,'income');state.settings.incomeMode=f.get('incomeMode');});}
function demo(){if(corruptStored){showToast('Reset or restore a backup first.');return;}if((state.debts.length||state.bills.length||state.transactions.length||state.settings.income||state.sources.length||state.paychecks.length||state.savings.length)&&!confirm('Replace your current entries with fictional demo data? Export a backup first if you want to keep them.'))return;
  state=blank();state.demo=true;state.settings={income:450000,extra:20000,strategy:'avalanche',incomeMode:'monthly'};state.debts=[{id:uid(),name:'Everyday card',balance:420000,apr:19.9,minimum:12000,due:18},{id:uid(),name:'Personal loan',balance:680000,apr:8.5,minimum:21000,due:5},{id:uid(),name:'Medical balance',balance:120000,apr:0,minimum:10000,due:23}];state.bills=[{id:uid(),name:'Rent',amount:140000,category:'Housing',due:1},{id:uid(),name:'Groceries',amount:45000,category:'Food',due:5},{id:uid(),name:'Utilities',amount:17000,category:'Utilities',due:15},{id:uid(),name:'Car insurance',amount:18000,category:'Insurance',due:20}];state.transactions=[{id:uid(),type:'expense',name:'Rent',amount:140000,interest:0,date:today.slice(0,7)+'-01',category:'Housing',debtId:null},{id:uid(),type:'expense',name:'Weekly groceries',amount:8500,interest:0,date:today,category:'Food',debtId:null},{id:uid(),type:'payment',name:'Everyday card payment',amount:18000,interest:6000,date:today,debtId:state.debts[0].id,category:'Other'}];state.sources=[{id:uid(),name:'Example salary',frequency:'semimonthly',startDate:today.slice(0,7)+'-01',day1:15,day2:31,amount:225000,amount2:225000}];state.savings=[{id:uid(),name:'Emergency fund',account:'Example savings account',balance:100000,target:300000},{id:uid(),name:'Moving fund',account:'Example savings account',balance:50000,target:250000}];month=today.slice(0,7);save();$('#modal').close();render();showToast('Fictional demo loaded. Reset in Settings to start fresh.');}
function action(act,id){
  if(extraAction(act,id))return;
  if(act==='debt'||act==='edit-debt')debtForm(id);
  if(act==='bill'||act==='edit-bill')billForm(id);
  if(act==='transaction'||act==='payment')transactionForm(id);
  if(act==='view-activity'){view='activity';render();}
  if(act==='export')exportBackup();
  if(act==='import')$('#import-file').click();
  if(act==='demo')demo();
  if(act==='reset'&&confirm('Erase all Pocket Plan data in this browser? Export a backup first if you want to keep it.')){state=blank();corruptStored=false;save();$('#modal').close();render();}
  if(act==='save-plan'){const extra=Number($('#extra').value);if($('#extra').value===''||!Number.isFinite(extra)||extra<0||extra>1e10){showToast('Enter a valid extra payment.');return;}if(corruptStored){showToast('Reset or restore a backup first.');return;}state.settings.extra=Math.round(extra*100);state.settings.strategy=$('#strategy').value;save();render();showToast(storageIssue?'Export a backup; local saving failed.':'Payoff plan updated.');}
  if(act==='delete-tx'&&confirm('Delete this entry? A debt payment deletion restores its tracked principal.')){state.transactions=state.transactions.filter(t=>t.id!==id);save();render();}
  if(act==='delete-bill'&&confirm('Remove this bill from your monthly plan? Logged expenses stay in Activity.')){state.bills=state.bills.filter(b=>b.id!==id);save();render();}
  if(act==='delete-debt'){if(state.transactions.some(t=>t.debtId===id)){showToast('Delete this debt’s logged payments in Activity first.');return;}if(confirm('Delete this debt and its payoff target?')){state.debts=state.debts.filter(d=>d.id!==id);save();render();}}
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;render();window.scrollTo(0,0);}const b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset.id);});
$('#month').addEventListener('change',e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){month=e.target.value;render();}});
$('#settings').onclick=settings;$('#backup').onclick=exportBackup;$('#restore').onclick=()=>$('#import-file').click();
$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10e6)throw Error('Backup is too large (maximum 10 MB).');const imported=validate(JSON.parse(await file.text()));if(!confirm('Replace current entries with this backup?'))return;state=imported;corruptStored=false;save();$('#modal').close();render();showToast(storageIssue?'Loaded in memory. Export a backup before closing.':'Backup restored.');}catch(err){showToast('Could not restore: '+err.message);}finally{e.target.value='';}};
render();
</script></body></html>
